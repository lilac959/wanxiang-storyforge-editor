<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>叙境 · 在线互动影游编辑器</title>
    <link rel="stylesheet" href="studio/player.css" />
    <link rel="stylesheet" href="studio/editor.css" />
  </head>
  <body>
    <div id="studio"><p class="boot">正在打开创作工作台…</p></div>
    <div id="toast" role="status"></div>
    <dialog id="preview">
      <button class="preview-close" aria-label="关闭试玩">×</button>
      <div class="preview-devices" aria-label="预览尺寸">
        <button data-preview-device="desktop">桌面</button
        ><button data-preview-device="portrait">竖屏</button
        ><button data-preview-device="landscape">横屏</button>
      </div>
      <div class="preview-host"></div>
    </dialog>
    <dialog id="panel">
      <div class="panel-content"></div>
      <button class="panel-close">关闭</button>
    </dialog>
    <input type="file" id="importFile" accept=".zip,.json" hidden /><input
      type="file"
      id="assetFiles"
      accept="video/*,audio/*,image/png,image/jpeg,image/webp,image/gif"
      multiple
      hidden
    />
    <script src="archive.js"></script>
    <script type="module" src="studio/editor.mjs"></script>
  </body>
</html>

<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>叙境 StoryForge · 互动影游编辑器</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="ux-theme.css"><link rel="stylesheet" href="psd-theme.css"></head>
<body><header><a class="brand" href="#"><span class="brandmark">叙</span>叙境 <small>STORYFORGE</small></a><span class="divider"></span><input id="projectName" aria-label="项目名称" value="万象环轨"><span class="badge">草稿</span><span class="saved" id="saved">● 已保存到本机</span><button id="saveConfig" title="保存全部配置并更新编辑区与试玩">保存配置</button><button id="importProject">导入项目</button><button id="exportProject">导出项目 ↗</button><button class="primary" id="playAll">▷ 试玩作品</button></header>
<div class="app"><aside class="rail"><button data-page="story" class="active"><b>⌘</b>剧情编排</button><button data-page="loading"><b>◌</b>加载页面</button><button data-page="splash"><b>◈</b>开屏动画</button><div class="railbottom">SF<span>本地工作区</span></div></aside><aside class="library"><div class="eyebrow">YOUR STORY, YOUR RULES</div><h2 id="leftTitle">剧情节点 <span id="nodeCount">04</span></h2><p class="muted">每一段影像，都是故事的新可能</p><button class="add" id="addNode">＋ 新建剧情节点</button><div id="nodeList"></div><div class="librarynote"><span>✦ 创作提示</span><p>选择一个节点，添加视频与交互。将不同选择连接到下一段故事。</p><span class="subtle">所有编辑自动保存在当前浏览器</span></div></aside>
<main><div class="workspacehead"><div><span class="eyebrow">STORY WORKSPACE</span><h1 id="mainTitle">剧情编排</h1></div><div class="segmented"><button id="sceneView" class="active">画面编辑</button><button id="graphView">故事地图</button></div><button id="previewCurrent">▷ 预览当前</button></div><div id="editorArea"></div><footer><span><i class="dot"></i> 创作模式</span><span>16:9 · 自适应画布</span><span id="footerInfo">节点间的每一次选择，都由你定义</span></footer></main><aside class="inspector"><div class="inspectorhead"><span>属性设置</span><span class="subtle">☷</span></div><div id="properties"></div></aside></div>
<div id="toast" role="status"></div><input type="file" id="mediaFile" accept="video/*" hidden><input type="file" id="replaceBoardFile" accept="image/png,image/jpeg,image/webp,image/gif" hidden><input type="file" id="boardFiles" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden><input type="file" id="imageFile" accept="image/*" hidden><input type="file" id="projectFile" accept="application/json,.json,application/zip,.zip" hidden><dialog id="player"><button class="close" id="closePlayer" aria-label="关闭试玩">×</button><div id="playerScreen"></div><div class="playerfooter"><span id="playerStatus">作品试玩</span><button id="restartPlayer">↺ 重新开始</button></div></dialog><script src="archive.js"></script><script src="qte-audio.js"></script><script src="mouse-qte.js"></script><script src="tail-qte.js"></script><script src="timeline-editor.js"></script><script src="cinema.js"></script><script src="choice-position.js"></script><script src="cloud-sync.js"></script><script src="app.js"></script><script src="sorting.js"></script><script src="board-menu.js"></script></body></html>
